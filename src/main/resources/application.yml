spring:
  application.name: ecom
  datasource:
    {
      url: "jdbc:h2:mem:ecom;MODE=PostgreSQL;DB_CLOSE_DELAY=-1",
      username: sa,
      password: "",
    }
  jpa: { hibernate.ddl-auto: update, open-in-view: false }
  h2.console.enabled: true
  cache:
    { type: caffeine, caffeine.spec: "maximumSize=500,expireAfterWrite=10m" }
management.endpoints.web.exposure.include: health,info,metrics,beans
app.jwt:
  {
    secret: "${JWT_SECRET:development-only-secret-change-this-to-at-least-32-characters}",
    expiration: 3600000,
  }
